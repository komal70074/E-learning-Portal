{% extends "adminparent.html" %}
{% block body %}
{% if messages %}
   {% for message in messages %}
     <div class="alert alert-success-dimissible d=fade show" role="alert">
      {{message}}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
     </div>
   {% endfor %}
{% endif %}
    <div class="row">
        <div class="col-sm-12">
            <h1 style="text-align:center;">Upload Study Material</h1>   
              <form class="form-group mt-5" method="post" action="{% url 'adminapp:uploadmaterial'%}" enctype="multipart/form-data">
                {% csrf_token %}
                <table class="table table-bordered text-light" style="width: 60%;margin: auto;">
                    <tr>
                        <td>Program</td>
                        <td><select name="program" class="form-control text-light">
                            <option selected>---------------select program------------------</option>
                            <option value="M.Tech">M.Tech</option>
                            <option value="B.Tech">B.Tech</option>
                            <option value="Diploma">Diploma</option>
                                    
                        </select></td>
                      </tr>
                      <tr>
                        <td>Branch</td>
                        <td><select name="branch" class="form-control text-light">
                            <option selected>---------------select branch------------------</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Information Technology">Information Technology</option>        
                        </select></td>
                      </tr>
                      <tr>
                        <td>Year</td>
                        <td>
                            <select name="year" class="form-control text-light">
                               <option selected>---------------select year------------------</option>
                               <option value="First Year">First Year</option>
                               <option value="Second Year">Second Year</option>
                               <option value="Third YEar">Third Year</option>
                               <option value="Final Year">Final Year</option>          
                            </select>
                         </td>
                      </tr>
                      <tr>
                        <td>Enter Subject Name</td>
                        <td><input type="text" name="subject" class="form-control text-light"/></td>
                      </tr>
                      <tr>
                        <td>Select Material Type</td>
                        <td>
                            <select name="materialtype" class="form-control text-light">
                                 <option selected>-----Select Material type------</option>
                                 <option value="smat">Study Material</option>
                                <option value="assign">Assignment</option>
                            </select>
                           </td>
                      </tr>
                      <tr>
                        <td>Enter File Name</td>
                        <td><input type="text" name="filename" class="form-control text-light"/></td>
                      </tr>
                      <tr>
                        <td>Select File to Upload</td>
                        <td><input type="file" name="myfile" class="form-control text-light"/></td>
                      </tr>
                      <tr>
                        <td colspan="2" style="text-align: center;">
                             <button type="submit" class="btn btn-warning">Upload</button></td>
                      </tr>
                </table>
              </form>
        </div>
    </div>
{% endblock body %}
